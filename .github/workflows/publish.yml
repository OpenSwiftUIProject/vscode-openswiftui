name: Release extension
run-name: Release ${{ inputs.tag || github.ref_name }} (${{ inputs.operation || 'publish' }})

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag that matches package.json (for example, 0.1.1)
        required: true
        type: string
      operation:
        description: Package, inspect identity, or publish to one or both destinations
        default: package
        required: true
        type: choice
        options: [package, identity, github-release, marketplace, publish]

permissions:
  contents: read

concurrency:
  group: extension-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.manifest.outputs.tag }}
      file: ${{ steps.manifest.outputs.file }}
      commit: ${{ steps.package.outputs.commit }}
      sha256: ${{ steps.package.outputs.sha256 }}
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check release identity
        id: manifest
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          PUSH_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag) || tag !== manifest.version) {
            throw new Error('Use a stable release tag that matches package.json exactly.');
          }
          if (manifest.publisher !== 'OpenSwiftUIProject' || manifest.name !== 'openswiftui-preview') {
            throw new Error('The extension identity does not match the Marketplace publisher.');
          }
          if (lock.version !== tag || lock.packages[''].version !== tag) {
            throw new Error('The lockfile version must match the release tag.');
          }
          if (process.env.PUSH_COMMIT && execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() !== process.env.PUSH_COMMIT) {
            throw new Error('The release tag no longer matches the pushed commit.');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `file=${manifest.name}-${tag}.vsix\n`);
          NODE
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test extension
        run: npm test
      - name: Package universal VSIX
        id: package
        env:
          VSIX_FILE: ${{ steps.manifest.outputs.file }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-artifacts"
          npm run package -- --out "$RUNNER_TEMP/release-artifacts/$VSIX_FILE"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cd "$RUNNER_TEMP/release-artifacts"
          sha256sum "$VSIX_FILE" > SHA256SUMS
          echo "sha256=$(cut -d ' ' -f 1 SHA256SUMS)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: marketplace-vsix
          path: ${{ runner.temp }}/release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish GitHub Release
    needs: package
    if: github.event_name == 'push' || inputs.operation == 'github-release' || inputs.operation == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Use this workflow's scripts even when manually releasing an older tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Test release publication
        run: node --test .github/scripts/github-release.test.cjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact }}
          path: ${{ runner.temp }}/release-artifacts
          merge-multiple: true
      - name: Create or resume the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.package.outputs.commit }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/release-artifacts
          VSIX_FILE: ${{ needs.package.outputs.file }}
          VSIX_SHA256: ${{ needs.package.outputs.sha256 }}
        run: node .github/scripts/github-release.cjs

  marketplace:
    name: Publish to Marketplace
    needs: package
    if: github.event_name == 'push' || inputs.operation == 'identity' || inputs.operation == 'marketplace' || inputs.operation == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - name: Check publishing configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ]; then
            echo '::error::Set AZURE_CLIENT_ID and AZURE_TENANT_ID in the marketplace environment.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install publishing tool
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact }}
          path: ${{ runner.temp }}/marketplace-vsix
          merge-multiple: true
      - name: Verify package checksum
        working-directory: ${{ runner.temp }}/marketplace-vsix
        env:
          VSIX_FILE: ${{ needs.package.outputs.file }}
          VSIX_SHA256: ${{ needs.package.outputs.sha256 }}
        run: printf '%s  %s\n' "$VSIX_SHA256" "$VSIX_FILE" | sha256sum --check --strict
      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Show Marketplace profile ID for publisher setup
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'identity'
        run: |
          az rest \
            --url 'https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1' \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id --output tsv
      - name: Publish to Marketplace
        if: github.event_name == 'push' || inputs.operation == 'marketplace' || inputs.operation == 'publish'
        env:
          VSIX_FILE: ${{ needs.package.outputs.file }}
        run: ./node_modules/.bin/vsce publish --azure-credential --packagePath "$RUNNER_TEMP/marketplace-vsix/$VSIX_FILE"
